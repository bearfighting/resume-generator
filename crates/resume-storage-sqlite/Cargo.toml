[package]
name = "resume-storage-sqlite"
version = "0.1.0"
edition = "2021"

[dependencies]
resume-domain = { path = "../resume-domain" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
